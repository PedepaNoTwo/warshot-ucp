<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warshot PVP - UCP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #a037ff;
      --primary-dark: #8a2be2;
      --secondary: #d45eff;
      --dark: #1a1a2e;
      --light: #f8f9fa;
      --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      background: url('https://images.unsplash.com/photo-1518655048521-f130df041f66?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center;
      background-size: cover;
    }
    
    body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }
    
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    
    .particle {
      position: absolute;
      background: rgba(160, 55, 255, 0.5);
      border-radius: 50%;
      animation: float 15s infinite linear;
    }
    
    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-1000px) rotate(720deg);
        opacity: 0;
      }
    }
    
    .login-container {
      background: rgba(26, 0, 51, 0.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(160, 55, 255, 0.3);
      width: 420px;
      padding: 40px;
      text-align: center;
      z-index: 2;
      position: relative;
      overflow: hidden;
      transition: transform 0.5s ease;
    }
    
    .login-container:hover {
      transform: translateY(-10px);
    }
    
    .login-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 100%;
      height: 100%;
      background: rgba(160, 55, 255, 0.05);
      transform: skewX(-15deg);
      pointer-events: none;
      z-index: -1;
    }
    
    h1 {
      font-size: 28px;
      color: var(--light);
      margin-bottom: 30px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      background: linear-gradient(90deg, #ffffff 0%, #a037ff 50%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }
    
    @keyframes shine {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    
    .input-group {
      margin-bottom: 25px;
      text-align: left;
      position: relative;
    }
    
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }
    
    .input-field {
      position: relative;
    }
    
    input, select {
      width: 100%;
      padding: 15px 20px 15px 45px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(160, 55, 255, 0.3);
      border-radius: 10px;
      font-size: 14px;
      color: var(--light);
      transition: all 0.3s ease;
    }
    
    input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    
    input:focus, select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(160, 55, 255, 0.3);
      background: rgba(0, 0, 0, 0.5);
    }
    
    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
    }
    
    .btn {
      width: 100%;
      padding: 15px;
      background: var(--gradient);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 5px 15px rgba(160, 55, 255, 0.4);
      position: relative;
      overflow: hidden;
    }
    
    .btn:hover {
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      box-shadow: 0 7px 20px rgba(160, 55, 255, 0.6);
      transform: translateY(-2px);
    }
    
    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(255, 255, 255, 0.1);
      transform: rotate(45deg);
      transition: all 0.5s ease;
    }
    
    .btn:hover::after {
      left: 100%;
    }
    
    .links {
      margin-top: 25px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
    
    .links a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: color 0.3s ease;
      font-weight: 500;
    }
    
    .links a:hover {
      color: var(--primary);
      text-decoration: underline;
    }
    
    /* Botão Admin */
    .admin-btn {
      width: 100%;
      padding: 15px;
      background: transparent;
      color: white;
      border: 2px solid var(--primary);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
    }
    
    .admin-btn:hover {
      background: rgba(160, 55, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .admin-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 12px;
      background: linear-gradient(270deg, 
        #ff0000, #ff7b00, #fffb00, #48ff00, 
        #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
      background-size: 600% 600%;
      animation: rainbowBorder 6s linear infinite;
      z-index: -1;
    }
    
    @keyframes rainbowBorder {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    
    /* Server Tabs */
    .server-tabs {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
      gap: 10px;
    }
    
    .server-tab {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
      border: 1px solid rgba(160, 55, 255, 0.3);
      color: rgba(255, 255, 255, 0.8);
    }
    
    .server-tab:hover {
      background: rgba(160, 55, 255, 0.2);
    }
    
    .server-tab.active {
      background: rgba(160, 55, 255, 0.3);
      border: 1px solid var(--primary);
      color: white;
      box-shadow: 0 0 10px rgba(160, 55, 255, 0.5);
    }
    
    /* Alertas */
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
      text-align: center;
      font-size: 14px;
    }
    
    .alert-success {
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid #00ff00;
      color: #00ff00;
    }
    
    .alert-error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid #ff0000;
      color: #ff0000;
    }

    /* Player Info */
    .player-info {
      text-align: left;
      margin: 20px 0;
      background: rgba(30, 30, 30, 0.7);
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #a037ff;
    }
    
    .player-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .stat-card {
      padding: 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }
    
    .admin-level {
      color: #ff0000;
    }
    
    .vip-level {
      color: #ffcc00;
    }
    
    .money {
      color: #00ff00;
    }
    
    .bank {
      color: #0099ff;
    }
    
    .gold {
      color: #ffcc00;
    }
    
    .vip-coins {
      color: #ff00ff;
    }
    
    .player-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #a037ff;
      margin: 0 auto 15px;
      object-fit: cover;
      display: block;
    }
    
    /* Inventory */
    .inventory-grid, .shop-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 15px 0;
    }
    
    .inventory-item, .shop-item {
      background: rgba(40, 40, 40, 0.7);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      border: 1px solid #333;
      transition: all 0.3s;
    }
    
    .inventory-item:hover, .shop-item:hover {
      border-color: #a037ff;
      transform: translateY(-3px);
    }
    
    .item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .item-amount, .item-price {
      color: #a037ff;
      font-size: 14px;
    }
    
    .shop-tabs {
      display: flex;
      margin-bottom: 15px;
      border-bottom: 1px solid #333;
    }
    
    .shop-tab {
      padding: 10px 15px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s;
    }
    
    .shop-tab.active {
      border-bottom: 2px solid #a037ff;
      color: #a037ff;
    }
    
    .shop-tab:hover {
      color: #d45eff;
    }

    /* Admin Panel */
    .admin-panel {
      text-align: left;
    }
    
    .admin-section {
      background: rgba(30, 30, 30, 0.7);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid #ff5555;
    }
    
    .admin-section h3 {
      color: #ff5555;
      margin-bottom: 10px;
    }
    
    .admin-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    
    .admin-actions .btn {
      padding: 8px 12px;
      font-size: 14px;
    }

    /* Menu Toggle */
    .menu-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(160, 55, 255, 0.3);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      z-index: 101;
      transition: all 0.3s;
    }
    
    .menu-toggle:hover {
      background: rgba(160, 55, 255, 0.5);
      transform: scale(1.1);
    }

    /* Side Menu */
    .side-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: rgba(20, 10, 30, 0.95);
      padding: 20px 0;
      transition: left 0.3s;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    
    .side-menu.active {
      left: 0;
    }
    
    .menu-items {
      list-style: none;
      padding: 15px;
    }
    
    .menu-items a {
      display: flex;
      align-items: center;
      padding: 12px;
      color: #ddd;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 5px;
      transition: all 0.3s;
    }
    
    .menu-items a:hover {
      background: rgba(160, 55, 255, 0.2);
      transform: translateX(5px);
    }
    
    .menu-items i {
      margin-right: 10px;
      width: 20px;
      text-align: center;
    }
    
    /* Admin Menu */
    .admin-menu .menu-items a {
      color: #ff5555;
    }
    
    .admin-menu .menu-items a:hover {
      background: rgba(255, 85, 85, 0.1);
    }
    
    /* Responsividade */
    @media (max-width: 480px) {
      .login-container {
        width: 90%;
        padding: 30px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .player-stats, .inventory-grid, .shop-items {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .menu-toggle {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <!-- Efeito de partículas -->
  <div class="particles" id="particles"></div>
  
  <!-- Botões de menu -->
  <button class="menu-toggle" id="playerMenuToggle" onclick="toggleMenu('player')"><i class="fas fa-bars"></i></button>
  <button class="menu-toggle" id="adminMenuToggle" onclick="toggleMenu('admin')"><i class="fas fa-bars"></i></button>

  <!-- Menus Laterais -->
  <div class="side-menu" id="playerMenu">
    <ul class="menu-items">
      <li><a href="#" onclick="showPlayerInfo()">
        <i class="fas fa-user"></i>
        Informações
      </a></li>
      <li><a href="#" onclick="showShop()">
        <i class="fas fa-shopping-cart"></i>
        Loja
      </a></li>
      <li><a href="#" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>
        Sair
      </a></li>
    </ul>
  </div>

  <div class="side-menu admin-menu" id="adminMenu">
    <ul class="menu-items">
      <li><a href="#" onclick="showAdminPanel()">
        <i class="fas fa-tachometer-alt"></i>
        Painel Admin
      </a></li>
      <li><a href="#" onclick="showReports()">
        <i class="fas fa-exclamation-circle"></i>
        Denúncias
      </a></li>
      <li><a href="#" onclick="showPlayerManagement()">
        <i class="fas fa-users"></i>
        Gerenciar Players
      </a></li>
      <li><a href="#" onclick="showAdminManagement()">
        <i class="fas fa-user-shield"></i>
        Dar Admin
      </a></li>
      <li><a href="#" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>
        Sair
      </a></li>
    </ul>
  </div>

  <!-- Conteúdo Principal -->
  <div class="login-container" id="main">
    <h1>Warshot PVP</h1>
    
    <div id="loginForm">
      <div class="input-group">
        <label for="user">Nome de Usuário</label>
        <div class="input-field">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="user" placeholder="Digite seu usuário" required>
        </div>
      </div>
      
      <div class="input-group">
        <label for="pass">Senha</label>
        <div class="input-field">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="pass" placeholder="Digite sua senha" required>
        </div>
      </div>
      
      <div class="server-tabs" id="loginServers">
        <div class="server-tab active" onclick="selectServer(1)">Servidor 1</div>
        <div class="server-tab" onclick="selectServer(2)">Servidor 2</div>
      </div>
      
      <button class="btn" onclick="login()">Entrar</button>
      <button class="admin-btn" onclick="showAdminLogin()">Acesso Staff</button>
      
      <div class="links">
        <a href="#" onclick="showRegisterForm()"><i class="fas fa-user-plus"></i> Criar Conta</a>
        <a href="#" onclick="showRecoverForm()"><i class="fas fa-key"></i> Recuperar Senha</a>
      </div>
    </div>
  </div>
  
  <script>

    const players = [
      {

      vip: [
        { id: 1, name: "VIP Bronze", price: 50, benefits: "Tag no jogo, 5% mais dinheiro" },

        { id: 9, name: "Sanchez", price: 30, type: "bike" },
        { id: 10, name: "Adder", price: 150, type: "car" },
        { id: 11, name: "Oppressor", price: 200, type: "bike" },
        { id: 12, name: "Zentorno", price: 180, type: "car" },
        { id: 13, name: "Bati 801", price: 90, type: "bike" }
      ]
    };

    // Variáveis de estado
    let currentUser = null;
    let currentAdmin = null;
    let selectedServer = 1;
    let recoveryEmail = '';
    let currentShopTab = 'vip';

    // Criar partículas dinâmicas
    document.addEventListener('DOMContentLoaded', function() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 20;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        const size = Math.random() * 4 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.top = `${Math.random() * 100}%`;
        particle.style.animationDuration = `${Math.random() * 20 + 10}s`;
        particle.style.animationDelay = `${Math.random() * 10}s`;
        
        particlesContainer.appendChild(particle);
      }
    });

    // Funções do menu
    function toggleMenu(type) {
      const menuId = type + 'Menu';
      const menu = document.getElementById(menuId);
      menu.classList.toggle('active');
    }

    function showMenu(type) {
      document.getElementById(type + 'MenuToggle').style.display = 'flex';
    }

    function hideAllMenus() {
      document.getElementById('playerMenuToggle').style.display = 'none';
      document.getElementById('adminMenuToggle').style.display = 'none';
      document.getElementById('playerMenu').classList.remove('active');
      document.getElementById('adminMenu').classList.remove('active');
    }

    // Funções de navegação (Player)
    function showPlayerInfo() {
      document.getElementById('main').innerHTML = `
        <h1>Informações do Jogador</h1>
        <img src="${currentUser.avatar}" class="player-avatar" alt="Avatar do Jogador">
        
        <div class="player-stats">
          <div class="stat-card">
            <span>Level Normal</span>
            <div class="stat-value">${currentUser.level}</div>
          </div>
          
          ${currentUser.adminLevel > 0 ? `
            <div class="stat-card admin-level">
              <span>Level Admin</span>
              <div class="stat-value">${currentUser.adminLevel}</div>
            </div>
          ` : ''}
          
          ${currentUser.vipLevel > 0 ? `
            <div class="stat-card vip-level">
              <span>Level Sócio</span>
              <div class="stat-value">${currentUser.vipLevel}</div>
            </div>
          ` : ''}
          
          <div class="stat-card money">
            <span>Dinheiro Mão</span>
            <div class="stat-value">$${currentUser.money.toLocaleString()}</div>
          </div>
          
          <div class="stat-card bank">
            <span>Dinheiro Banco</span>
            <div class="stat-value">$${currentUser.bank.toLocaleString()}</div>
          </div>
          
          <div class="stat-card gold">
            <span>Ouros</span>
            <div class="stat-value">${currentUser.gold.toLocaleString()}</div>
          </div>
          
          <div class="stat-card vip-coins">
            <span>Moedas VIP</span>
            <div class="stat-value">${currentUser.vipCoins.toLocaleString()}</div>
          </div>
        </div>

    function showShop() {
      document.getElementById('main').innerHTML = `
        <h1>Loja VIP</h1>
        <div class="shop-tabs">
          <div class="shop-tab ${currentShopTab === 'vip' ? 'active' : ''}" onclick="changeShopTab('vip')">VIP</div>
          <div class="shop-tab ${currentShopTab === 'coins' ? 'active' : ''}" onclick="changeShopTab('coins')">Moedas</div>
          <div class="shop-tab ${currentShopTab === 'vehicles' ? 'active' : ''}" onclick="changeShopTab('vehicles')">Veículos</div>
        </div>
        <div id="shopContent">
          ${renderShopContent()}
        </div>
        <button class="btn" onclick="toggleMenu('player')">Voltar</button>
      `;
    }

    function renderShopContent() {
      if (currentShopTab === 'vip') {
        return `
          <div class="shop-items">
            ${shopItems.vip.map(item => `
              <div class="shop-item">
                <div class="item-name">${item.name}</div>
                <div class="item-price">${item.price} Moedas</div>
                <div style="font-size: 12px; margin: 5px 0; color: #aaa;">${item.benefits}</div>
                <button class="btn" onclick="buyItem(${item.id}, '${currentShopTab}')">Comprar</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (currentShopTab === 'coins') {
        return `
          <div class="shop-items">
            ${shopItems.coins.map(item => `
              <div class="shop-item">
                <div class="item-name">${item.name}</div>
                <div style="font-size: 14px; margin: 5px 0;">${item.realMoney}</div>
                ${item.bonus ? `<div style="color: #ffcc00; font-size: 12px;">${item.bonus}</div>` : ''}
                <button class="btn" onclick="buyCoins(${item.id})">Comprar</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (currentShopTab === 'vehicles') {
        return `
          <div class="shop-items">
            ${shopItems.vehicles.map(item => `
              <div class="shop-item">
                <div class="item-name">${item.name}</div>
                <div class="item-price">${item.price} Moedas</div>
                <div style="font-size: 12px; color: #aaa;">${item.type}</div>
                <button class="btn" onclick="buyVehicle(${item.id})">Comprar</button>
              </div>
            `).join('')}
          </div>
        `;
      }
      return '';
    }

    function changeShopTab(tab) {
      currentShopTab = tab;
      document.getElementById('shopContent').innerHTML = renderShopContent();
    }

    function buyItem(itemId, category) {
      const item = shopItems[category].find(i => i.id === itemId);
      if (!item) return;
      
      if (currentUser.vipCoins >= item.price) {
        currentUser.vipCoins -= item.price;
        
        // Aplicar benefícios do VIP
        if (category === 'vip') {
          if (itemId === 1) currentUser.vipLevel = 1;
          else if (itemId === 2) currentUser.vipLevel = 2;
          else if (itemId === 3) currentUser.vipLevel = 3;
        }
        
        showAlert(`Você comprou ${item.name} com sucesso!`, 'success');
        showPlayerInfo(); // Atualiza as informações
      } else {
        showAlert('Você não tem moedas VIP suficientes!', 'error');
      }
    }

    function buyCoins(packageId) {
      const pack = shopItems.coins.find(p => p.id === packageId);
      if (!pack) return;
      
      showAlert(`Redirecionando para pagamento de ${pack.realMoney}...`, 'success');
      setTimeout(() => {
        // Simula a compra bem-sucedida
        const coinsToAdd = parseInt(pack.name.split(' ')[0]) + (pack.bonus ? parseInt(pack.bonus.split('+')[1]) : 0);
        currentUser.vipCoins += coinsToAdd;
        showAlert(`Você recebeu ${coinsToAdd} moedas VIP!`, 'success');
        showPlayerInfo(); // Atualiza as informações
      }, 2000);
    }

    function buyVehicle(vehicleId) {
      const vehicle = shopItems.vehicles.find(v => v.id === vehicleId);
      if (!vehicle) return;
      
      if (currentUser.vipCoins >= vehicle.price) {
        currentUser.vipCoins -= vehicle.price;
        currentUser.vehicles.push({
          id: vehicle.id,
          name: vehicle.name,
          type: vehicle.type
        });
        showAlert(`Você comprou o veículo ${vehicle.name} com sucesso!`, 'success');
        showPlayerInfo(); // Atualiza as informações
      } else {
        showAlert('Você não tem moedas VIP suficientes para comprar este veículo!', 'error');
      }
    }

    // Funções administrativas

    function showRegisterForm() {
      document.getElementById('main').innerHTML = `

    function showRecoverForm() {

          <label for="confirmNewPass">Confirmar Nova Senha</label>

          </div>

    function showLoginForm() {
      document.getElementById('main').innerHTML = `
        <h1>Warshot PVP</h1>
        <div id="loginAlert"></div>
        
        <div class="input-group">
          <label for="user">Nome de Usuário</label>
          <div class="input-field">

          </div>
        </div>
        
        <div class="server-tabs" id="loginServers">
          <div class="server-tab active" onclick="selectServer(1)">Servidor 1</div>

        <button class="btn" onclick="login()">Entrar</button>

          <a href="#" onclick="showRegisterForm()"><i class="fas fa-user-plus"></i> Criar Conta</a>

    function showAdminLogin() {
      document.getElementById('main').innerHTML = `
        <h1>Acesso Staff</h1>
        <div id="adminAlert"></div>
        
        <div class="input-group">
          <label for="adminUser">Usuário Staff</label>
          <div class="input-field">
            <i class="fas fa-user-shield input-icon"></i>
            <input type="text" id="adminUser" placeholder="Digite seu usuário staff" required>

        </div>
        
        <div class="input-group">
          <label for="adminPass">Senha Staff</label>
          <div class="input-field">

          </div>

        </div>
      `;
    }

    function showAlert(message, type) {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.textContent = message;
      
      const container = document.getElementById('main').querySelector('.alert') 
        ? document.getElementById('main').querySelector('.alert') 
        : document.getElementById('main').querySelector('#loginAlert, #registerAlert, #recoverAlert, #codeAlert, #adminAlert');
      
      if (container) {
        container.innerHTML = '';
        container.appendChild(alertDiv);
      }
      
      setTimeout(() => {
        if (alertDiv.parentNode) {
          alertDiv.remove();
        }
      }, 3000);
    }

    function login() {
      const username = document.getElementById('user').value;
      const password = document.getElementById('pass').value;
      
      const player = players.find(p => p.name === username && p.password === password);
      
      if (player) {
        currentUser = player;
        hideAllMenus();
        showMenu('player');
        showPlayerInfo();
        showAlert('Login realizado com sucesso!', 'success');
      } else {
        showAlert('Usuário ou senha incorretos!', 'error');
      }
    }

    function register() {
      const username = document.getElementById('regUser').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPass').value;
      const confirmPass = document.getElementById('regConfirmPass').value;
      
      if (password !== confirmPass) {
        showAlert('As senhas não coincidem!', 'error');
        return;
      }
      
      if (players.some(p => p.name === username)) {
        showAlert('Nome de usuário já em uso!', 'error');
        return;
      }
      
      if (players.some(p => p.email === email)) {
        showAlert('E-mail já cadastrado!', 'error');
        return;
      }
      
      players.push({
        name: username,
        email: email,
        password: password,
        level: 1,
        adminLevel: 0,
        vipLevel: 0,
        money: 1000,
        bank: 0,
        gold: 0,
        vipCoins: 0,
        avatar: "https://s11.aconvert.com/convert/p3r68-cdx67/5kz6y-pjr2w.jpg",
        inventory: [
          { id: 1, name: "Celular", type: "item", amount: 1 }
        ],
        vehicles: []
      });
      
      showAlert('Conta criada com sucesso! Faça login.', 'success');
      setTimeout(() => showLoginForm(), 2000);
    }

    function sendRecovery() {
      const email = document.getElementById('recoverEmail').value;
      const player = players.find(p => p.email === email);
      
      if (player) {
        recoveryEmail = email;
        showAlert('Código enviado para o e-mail cadastrado!', 'success');
        setTimeout(() => showRecoveryCodeForm(), 2000);
      } else {
        showAlert('E-mail não encontrado!', 'error');
      }
    }

    function verifyRecoveryCode() {
      const code = document.getElementById('recoveryCode').value;
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmNewPass').value;
      
      if (newPass !== confirmPass) {
        showAlert('As senhas não coincidem!', 'error');
        return;
      }
      
      const playerIndex = players.findIndex(p => p.email === recoveryEmail);
      if (playerIndex !== -1) {
        players[playerIndex].password = newPass;
        showAlert('Senha redefinida com sucesso!', 'success');
        setTimeout(() => showLoginForm(), 2000);
      }
    }

    function adminLogin() {
      const username = document.getElementById('adminUser').value;
      const password = document.getElementById('adminPass').value;
      
      const admin = admins.find(a => a.username === username && a.password === password);
      
      if (admin) {
        currentAdmin = admin;
        hideAllMenus();
        showMenu('admin');
        showAdminPanel();
        showAlert(`Staff logado com sucesso! Nível: ${admin.level}`, 'success');
      } else {
        showAlert('Credenciais inválidas!', 'error');
      }
    }

    function selectServer(server) {
      selectedServer = server;
      const tabs = document.querySelectorAll('.server-tab');
      tabs.forEach(tab => tab.classList.remove('active'));
      tabs[server-1].classList.add('active');
    }

    function logout() {
      currentUser = null;
      currentAdmin = null;
      hideAllMenus();
      showLoginForm();
    }

    // Inicialização
    hideAllMenus();
  </script>
